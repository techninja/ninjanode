<!doctype html>
<html>
  <head>
    <title>ninjanode</title>
    <link
      href="https://fonts.googleapis.com/css?family=Black+Ops+One"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Pixelify+Sans"
      rel="stylesheet"
      type="text/css"
    />
    <link rel="stylesheet" href="resources/forkme.css" />
    <link rel="stylesheet" href="resources/newstyles.css" />
    <link rel="stylesheet" href="icons/fonts/iconfont.css" />
    <script src="/pixi/pixi.js"></script>
    <script src="/pixi-filters/pixi-filters.js"></script>
    <script src="/particle-emitter/dist/particle-emitter.js"></script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"
    />
  </head>
  <body>
    <ninja-roster></ninja-roster>
    <ninja-window id="main-window" head="ninjanode">
      <h3 class="subhed">
        A fully open source web browser space ship game, for the hell of it.
      </h3>
      <ninja-tabs activeItem="play">
        <ninja-tab caption="Pick a name and a ship" icon="play" name="play">
          <ninja-ship-select></ninja-ship-select>
        </ninja-tab>
        <ninja-tab caption="Controls" icon="edit" name="controls">
          <ninja-controls></ninja-controls>
        </ninja-tab>
        <ninja-tab caption="Bots" icon="robot" name="bots">
          <ninja-bots></ninja-bots>
        </ninja-tab>
        <ninja-tab caption="Settings" icon="cog" name="settings">
          <ninja-settings></ninja-settings>
        </ninja-tab>
      </ninja-tabs>
    </ninja-window>
    <ninja-chat></ninja-chat>
    <div id="framerate"></div>
    <canvas id="stage" width="400" height="400"></canvas>
    <script type="importmap">
      {
        "imports": {
          "pixi.js": "/pixi/pixi.mjs",
          "pixi-viewport": "/pixi-viewport/pixi_viewport.js",
          "data": "/data/index.mjs",
          "emitters": "/data/emitters/index.mjs",
          "pixirender": "/modules/pixi/index.mjs",
          "models": "/data/stateModels/index.mjs",
          "modules": "/modules/index.mjs",
          "utils": "/modules/utils.mjs",
          "ui": "/modules/ui/index.mjs",
          "hybrids": "/hybrids/index.js"
        }
      }
    </script>
    <script type="module">
      import gameConfig from '/game' with { type: 'json' };
      import {
        ShipSocket,
        PixiRenderer,
        PixiInput,
        BotController,
      } from 'modules';
      import { store } from 'hybrids';
      import { AppState } from 'models';

      // Import and register all web components via side-effects.
      import 'ui';

      const server = `${location.protocol}//${location.host}/`;

      // Connect immediately...
      const socket = new ShipSocket(server);

      // Store Id in global state.
      socket.socket.on('connect', () => {
        store.set(AppState, { socketId: socket.socket.id });
      });

      const renderer = new PixiRenderer({
        socket,
        stageId: 'stage',
        framerateId: 'framerate',
        gameConfig,
      });
      window.renderer = renderer;

      const input = new PixiInput({
        renderer,
        socket,
      });

      // Bind the join event from ship selection.
      document
        .getElementsByTagName('ninja-ship-select')[0]
        .addEventListener('join', ({ detail: { ship: style, name } }) => {
          socket.join({ style, name });
        });

      // Setup the Bots
      const bots = [
        // new BotController(new ShipSocket(server)),
        // new BotController(new ShipSocket(server)),
        // new BotController(new ShipSocket(server)),
        // new BotController(new ShipSocket(server)),
      ];
    </script>
  </body>
</html>
